name: 部署博客后端

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: |
          npm ci
          npm --prefix worker ci
      - name: 建表（可重复执行）
        working-directory: worker
        run: npx wrangler d1 execute innovate-blog --remote --file=schema.sql
      - name: 同步付费正文
        run: node scripts/sync-paid.mjs --remote
      - name: 部署 Worker
        working-directory: worker
        run: npx wrangler deploy
